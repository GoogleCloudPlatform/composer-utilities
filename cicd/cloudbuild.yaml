steps:
  - id : 'Check for linting errors'
    name: 'ghcr.io/astral-sh/ruff'
    waitFor: ['-']
    args:
      - check
      - cicd
  - id : 'Check for formatting errors'
    name: 'ghcr.io/astral-sh/ruff'
    waitFor: ['-']
    args:
      - format
      - --check
      - cicd
  - id : 'Resolve Composer tagged image'
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['-']
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      python3 /workspace/cicd/get_composer_tagged_image.py > /workspace/.composer_image_tag
      echo "Resolved Composer tagged image: $(cat /workspace/.composer_image_tag)"
  - id : 'Run unit and integration tests on Airflow DAGs'
    name: 'gcr.io/cloud-builders/docker'
    waitFor:
      - 'Check for linting errors'
      - 'Check for formatting errors'
      - 'Resolve Composer tagged image'
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      COMPOSER_TAGGED_IMAGE=$(cat /workspace/.composer_image_tag)
      echo "Running tests in Composer container: $COMPOSER_TAGGED_IMAGE"

      docker run --rm \
        -v /workspace:/workspace \
        -w /workspace \
        --entrypoint /bin/bash \
        "$COMPOSER_TAGGED_IMAGE" \
        /workspace/cicd/run_tests.sh
  - id : 'Copy DAGs, data, and requirements to all Composer environments'
    name: gcr.io/cloud-builders/gcloud
    waitFor:
      - 'Run unit and integration tests on Airflow DAGs'
    script: |
      #!/usr/bin/env bash
      
      # Enable exit-on-error mode
      set -eo pipefail
      
      # Check if requirements.txt defines any PyPI packages
      if [ -f "cicd/dags/requirements.txt" ] && grep -E -v -q "^[[:space:]]*(#|$)" "cicd/dags/requirements.txt"; then
        UPDATE_PYPI=true
      else
        UPDATE_PYPI=false
        echo "No PyPI packages defined in cicd/dags/requirements.txt. Skipping PyPI packages update."
      fi
      
      # Copy DAGs, data, and requirements to all Composer environments only if unit tests pass
      pids=""
      for location in $MANAGED_AIRFLOW_LOCATIONS; do
        (
          location_pids=""
          # Get the environment name and storage bucket for all Composer environments in the specified location.
          while read -r env_path bucket; do
            if [[ -n "$env_path" && -n "$bucket" ]]; then
              (
                env_name=$(basename "$env_path")

                # Update PyPI packages, suppressing "No change in configuration" errors
                if [ "$UPDATE_PYPI" = true ]; then
                  while true; do
                    update_output=$(gcloud composer environments update "$env_name" \
                      --location "$location" \
                      --update-pypi-packages-from-file cicd/dags/requirements.txt 2>&1) && update_exit_code=0 || update_exit_code=$?
                    
                    if [ $update_exit_code -ne 0 ]; then
                      if echo "$update_output" | grep -E -q "No change in configuration|does not result in any change to the environment.*configuration"; then
                        echo "Composer environment $env_name is already up to date."
                        break
                      elif echo "$update_output" | grep -q "Cannot update environment in state UPDATING"; then
                        echo "Environment $env_name is currently UPDATING. Retrying in 60 seconds..."
                        sleep 60
                      else
                        echo "$update_output"
                        exit $update_exit_code
                      fi
                    else
                      echo "$update_output"
                      break
                    fi
                  done
                else
                  echo "Skipping PyPI packages update for $env_name (no packages defined in cicd/dags/requirements.txt)."
                fi

                # Sync the DAGs directory to the Composer environment's GCS bucket
                gcloud storage rsync --recursive --delete-unmatched-destination-objects cicd/dags gs://${bucket}/dags
              ) &
              location_pids+=" $!"
            fi
          done < <(gcloud composer environments list --locations=$location --format="value(name, storageConfig.bucket)")
          
          # Wait for all background processes for this location to complete
          FAIL_LOC=0
          for pid in $location_pids; do
            wait $pid || FAIL_LOC=1
          done
          exit $FAIL_LOC
        ) &
        pids+=" $!"
      done

      # Wait for all background processes to complete and capture their exit codes
      # We capture the PIDs of background subshells to wait on them concurrently
      FAIL=0
      for pid in $pids; do
        wait $pid || FAIL=1
      done
      
      if [ $FAIL -ne 0 ]; then
        echo "One or more concurrent updates failed."
        exit $FAIL
      fi
    env:
      - MANAGED_AIRFLOW_LOCATIONS=$_MANAGED_AIRFLOW_LOCATIONS
options:
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _MANAGED_AIRFLOW_LOCATIONS: 'us-east4 us-central1'

timeout: 14400s # 4 hours