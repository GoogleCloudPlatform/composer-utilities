name: Composer Cluster Policy CI

on:
  push:
    branches: ["main"]
    paths: ["composer_cluster_policy/**"]
  pull_request:
    branches: ["main"]
    paths: ["composer_cluster_policy/**"]
  workflow_dispatch:

jobs:
  lint:
    name: "ruff lint and format checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check formatting with ruff
        run: |
          uv run --project composer_cluster_policy --extra dev ruff format --check composer_cluster_policy

      - name: Lint with ruff
        run: |
          uv run --project composer_cluster_policy --extra dev ruff check composer_cluster_policy

  test:
    name: "run unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install composer_cluster_policy/
      - name: Test with unittest
        run: |
          python -m unittest discover -s composer_cluster_policy/tests
