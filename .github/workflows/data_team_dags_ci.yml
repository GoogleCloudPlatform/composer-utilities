name: Data Team DAGs Governance CI

# 🎯 Trigger ONLY when changes are made inside the data_team_repo directory
on:
  push:
    paths:
      - 'plugin_operators/data_team_repo/**'
    branches:
      - main
  pull_request:
    paths:
      - 'plugin_operators/data_team_repo/**'

jobs:
  verify-dag-governance:
    name: Verify DAG Governance & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔒 Run Data Team DAG Governance Tests
        run: |
          echo "=========================================================="
          echo "Validating Data Team DAGs against Platform Governance Rules"
          echo "=========================================================="
          python3 -B plugin_operators/run_tests.py --scope data
